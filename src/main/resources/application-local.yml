spring:
  datasource:
    url: jdbc:mysql://localhost:3306/jupjup
    username: root
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

ticket-server:
  url: http://localhost:8081
  api-key: ${TICKET_SERVER_API_KEY}