name: CI - Dev

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jupjup_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v6

      # 2. Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'

      # 3. Gradle Cache
      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. Gradle 실행 권한
      - name: Grant execute permission
        run: chmod +x gradlew

      # 5. Test
      - name: Run tests
        run: ./gradlew test
        env:
          SPRING_PROFILES_ACTIVE: test
          TICKET_SERVER_API_KEY: test-api-key

      # 6. JAR Build
      - name: Build JAR
        run: ./gradlew bootJar

      # -----------------------------------------
      # 여기부터는 dev에 실제 push 되었을 때만 실행
      # -----------------------------------------

      # application-dev.yml이 생성되는지 확인
      - name: Check JAR contents
        run: |
          echo "=== build/libs ==="
          ls -lah build/libs

          echo "=== application files ==="
          jar tf build/libs/*.jar | grep 'BOOT-INF/classes/application'

      # 7. AWS OIDC 인증
      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 8. ECR Login
      - name: Login to ECR
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2

      # 9. Docker Build & Push
      - name: Build and push Docker image
        if: github.event_name == 'push'
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          IMAGE_URI="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}"

          echo "Building image: $IMAGE_URI:$SHORT_SHA"

          docker build \
            --platform linux/arm64 \
            -t "$IMAGE_URI:$SHORT_SHA" \
            .

          docker push "$IMAGE_URI:$SHORT_SHA"

          echo "✅ Pushed: $IMAGE_URI:$SHORT_SHA"